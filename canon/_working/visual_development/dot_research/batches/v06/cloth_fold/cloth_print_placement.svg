<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="780" viewBox="0 0 1440 780">
<title>Research-only exact cloth-border placement, source v0.2.1</title>
<desc>Exact unchanged union d from source. Group A at original positions; group B translates the complete print +10u. Cloth size and fold material interval stay fixed. The red fold range is a construction guide, not print.</desc>
<defs><path id="source-A-union" d="M 0,0 L 12,0 L 11,3.5 L 9,3.5 L 9,2 L 3,2 L 3,6 L 7,6 L 8,8 L 2,8 L 2,9 L 9.9,9 L 9.1,11.8 L 7.5,11.8 L 7.5,10.6 L 2.7,10.6 L 2.7,13.8 L 5.9,13.8 L 6.7,15.4 L 2,15.4 L 2,16.4 L 8.325,16.4 L 7.675,18.675 L 6.375,18.675 L 6.375,17.7 L 2.475,17.7 L 2.475,20.3 L 5.075,20.3 L 5.725,21.6 L 0.525,21.6 L 0.525,16.4 L 1,16.4 L 1,15.4 L 0.3,15.4 L 0.3,9 L 1,9 L 1,8 L 0,8 Z"/><clipPath id="cloth-uv"><rect width="40" height="16"/></clipPath></defs>
<rect width="1440" height="780" fill="#f8f6ef"/>
<g font-family="sans-serif" fill="#262827"><text x="70" y="52" font-size="26">EXACT PRINT PLACEMENT / RESEARCH ONLY</text><text x="70" y="86" font-size="16">40u × 16u cloth • same fold material interval 17.2–22.8u • source is not redesigned</text></g>
<text x="70" y="125" font-family="sans-serif" font-size="17" fill="#262827">01  Source positions: x = 2.8u and 22.8u</text><g transform="translate(70 140) scale(17)"><rect width="40" height="16" fill="#d9d9cc"/><g clip-path="url(#cloth-uv)"><g id="print-shift-0" transform="translate(0 0)" fill="#272925"><use xlink:href="#source-A-union" transform="translate(2.8 12) scale(0.666666666666667) rotate(-90)"/><use xlink:href="#source-A-union" transform="translate(22.8 12) scale(0.666666666666667) rotate(-90)"/></g></g><g id="fold-guides-0" fill="none" stroke="#ac4b3c" stroke-width=".055" stroke-dasharray=".16 .12"><path d="M17.2,0 V16 M22.8,0 V16"/></g></g><text x="70" y="435" font-family="sans-serif" font-size="17" fill="#262827">02  Entire print translated +10u: x = 12.8u and 32.8u; right edge clips it</text><g transform="translate(70 450) scale(17)"><rect width="40" height="16" fill="#d9d9cc"/><g clip-path="url(#cloth-uv)"><g id="print-shift-10" transform="translate(10 0)" fill="#272925"><use xlink:href="#source-A-union" transform="translate(2.8 12) scale(0.666666666666667) rotate(-90)"/><use xlink:href="#source-A-union" transform="translate(22.8 12) scale(0.666666666666667) rotate(-90)"/></g></g><g id="fold-guides-10" fill="none" stroke="#ac4b3c" stroke-width=".055" stroke-dasharray=".16 .12"><path d="M17.2,0 V16 M22.8,0 V16"/></g></g><g font-family="sans-serif" font-size="18" fill="#43453e"><text x="850" y="164">Editable layers</text><text x="850" y="205">• source-A-union: exact original path</text><text x="850" y="235">• print-shift-0 / print-shift-10: placement</text><text x="850" y="265">• fold-guides: non-print construction</text><text x="850" y="325">Neither guide nor cavity is an object</text><text x="850" y="355">added to the physical cloth.</text><text x="850" y="475">+10u shift is the sole case change.</text><text x="850" y="505">No added repeat, repaired hook,</text><text x="850" y="535">or hidden-cavity outline.</text></g></svg>