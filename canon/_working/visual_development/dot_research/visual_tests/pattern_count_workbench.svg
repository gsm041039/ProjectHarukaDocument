<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><rect width="1200" height="820" fill="white"/><defs><path id="fixed-curved-cell" d="M0 0 C3 -0.6 8 -0.5 12 -1.2 C11 0 10.8 2 9 3.5 C9.5 1.5 9.3 1.2 8.1 1.2 C5.5 1.2 3 2.1 3 4 C3 5.6 4 6 7 6 L8 8 C4.5 7.8 2 8 0 8 C-1 5.5 -1 2.5 0 0 Z"/></defs><g font-family="sans-serif" fill="#111"><text x="45" y="45" font-size="25">PATTERN REPETITION WORKBENCH</text><text x="45" y="78" font-size="16">Same vector cell and largest-cell size. Construction hypothesis, not cutouts of generated art.</text></g><text x="200" y="133" font-family="sans-serif" font-size="30">1</text><g id="count-1" transform="translate(100 190) scale(21)" fill="black"><use href="#fixed-curved-cell" transform="translate(0.0 0) scale(1)"/></g><text x="580" y="133" font-family="sans-serif" font-size="30">2</text><g id="count-2" transform="translate(480 190) scale(21)" fill="black"><use href="#fixed-curved-cell" transform="translate(0.0 0) scale(1)"/><use href="#fixed-curved-cell" transform="translate(0.2999999999999998 9) scale(0.8)"/><rect x="1" y="8" width="1" height="1"/></g><text x="950" y="133" font-family="sans-serif" font-size="30">3</text><g id="count-3" transform="translate(850 190) scale(21)" fill="black"><use href="#fixed-curved-cell" transform="translate(0.0 0) scale(1)"/><use href="#fixed-curved-cell" transform="translate(0.2999999999999998 9) scale(0.8)"/><use href="#fixed-curved-cell" transform="translate(0.5249999999999999 16.4) scale(0.65)"/><rect x="1" y="8" width="1" height="1"/><rect x="1" y="15.4" width="1" height="1"/></g><g font-family="sans-serif" font-size="18" fill="#444"><text x="45" y="735">Only count changes. Straight spine arrangement held fixed in this workbench.</text><text x="45" y="770">Question: does the single hooked cell already read as a claw, before repetition makes a comb?</text></g></svg>