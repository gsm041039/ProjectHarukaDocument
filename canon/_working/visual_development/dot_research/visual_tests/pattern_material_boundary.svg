<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="white"/><defs><path id="identity" d="M0 0 C3 -0.6 8 -0.5 12 -1.2 C11 0 10.8 2 9 3.5 C9.5 1.5 9.3 1.2 8.1 1.2 C5.5 1.2 3 2.1 3 4 C3 5.6 4 6 7 6 L8 8 C4.5 7.8 2 8 0 8 C-1 5.5 -1 2.5 0 0 Z"/><clipPath id="identity-clip"><use href="#identity"/></clipPath></defs><g font-family="sans-serif" fill="#111"><text x="40" y="45" font-size="27">IDENTITY / MATERIAL BOUNDARY WORKBENCH</text><text x="40" y="80" font-size="17">Orange is a diagnostic stroke, not a proposed magic material.</text><text x="80" y="150" font-size="22">UNCLIPPED diagnostic</text><text x="680" y="150" font-size="22">CLIPPED to identity</text></g><g transform="translate(85 255) scale(32)"><use href="#identity" fill="#111"/><path d="M-1 4 C3 -2 7 10 13 2" fill="none" stroke="#ed8050" stroke-width="1.5"/></g><g transform="translate(680 255) scale(32)"><use href="#identity" fill="#111"/><g clip-path="url(#identity-clip)"><path d="M-1 4 C3 -2 7 10 13 2" fill="none" stroke="#ed8050" stroke-width="1.5"/></g></g><g font-family="sans-serif" fill="#444" font-size="17"><text x="80" y="585">Stroke enters the open cavity and exterior.</text><text x="680" y="585">Cavity and exterior remain untouched.</text><text x="40" y="625">This checks layer containment only. It does not validate liquid appearance or character use.</text></g></svg>