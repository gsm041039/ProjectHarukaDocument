<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Haruka — Story Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <script src="data/story_data.js"></script>
  <script src="data/directions_data.js"></script>
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <div id="sidebar-logo">
        <div class="logo-title">Project Haruka</div>
        <div class="logo-sub">Story Dashboard v2.1</div>
      </div>
      <nav id="sidebar-nav"></nav>
      <div id="sidebar-filters"></div>
    </div>

    <div id="main">
      <div id="topbar">
        <span id="topbar-title">Timeline</span>
      </div>
      <div id="content">
        <div id="view-timeline"        class="view active"></div>
        <div id="view-directions"      class="view"></div>
        <div id="view-direction"       class="view"></div>
        <div id="view-events"          class="view"></div>
        <div id="view-characters"      class="view"></div>
        <div id="view-character"       class="view"></div>
        <div id="view-matrix-ec"       class="view"></div>
        <div id="view-matrix-de"       class="view"></div>
        <div id="view-contradictions"  class="view"></div>
        <div id="view-files"           class="view"></div>
      </div>
    </div>

    <div id="detail-panel"></div>
    <div id="overlay"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
