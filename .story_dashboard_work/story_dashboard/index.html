<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Haruka — Story Dashboard</title>
<style>
:root {
  --bg: #0d0f14;
  --bg2: #161920;
  --bg3: #1e2230;
  --bg4: #252a3a;
  --border: #2e3348;
  --text: #c8ccd8;
  --text2: #8890a8;
  --text3: #555e78;
  --accent: #6b7fff;
  --accent2: #9b6bff;
  --green: #4caf82;
  --yellow: #e8b84b;
  --red: #e05555;
  --orange: #e07a35;
  --teal: #3ab8c8;

  --canon: #4caf82;
  --working: #e8b84b;
  --unresolved: #e05555;
  --canon-bg: rgba(76,175,130,0.12);
  --working-bg: rgba(232,184,75,0.12);
  --unresolved-bg: rgba(224,85,85,0.12);

  --sourced: #4caf82;
  --inferred: #e8b84b;
  --needs-input: #e07a35;
  --conflicting: #e05555;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; line-height: 1.6; }

/* HEADER */
.header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
.header h1 { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: 0.3px; }
.header .subtitle { font-size: 12px; color: var(--text2); }
.stats-row { display: flex; gap: 16px; margin-left: auto; flex-wrap: wrap; }
.stat { text-align: center; }
.stat-n { font-size: 22px; font-weight: 700; color: var(--accent); }
.stat-l { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; }

/* LAYOUT */
.layout { display: grid; grid-template-columns: 1fr 300px; gap: 0; min-height: calc(100vh - 120px); }
.main { padding: 20px 24px; }
.sidebar { background: var(--bg2); border-left: 1px solid var(--border); padding: 20px; overflow-y: auto; max-height: calc(100vh - 60px); position: sticky; top: 0; }

/* FILTERS */
.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
.filter-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; margin-right: 4px; }
.chip { padding: 4px 12px; border-radius: 20px; font-size: 12px; border: 1px solid var(--border); background: var(--bg3); color: var(--text2); cursor: pointer; transition: all 0.15s; user-select: none; }
.chip:hover { border-color: var(--accent); color: var(--text); }
.chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip.active-canon { background: var(--canon-bg); border-color: var(--canon); color: var(--canon); }
.chip.active-working { background: var(--working-bg); border-color: var(--working); color: var(--working); }
.chip.active-unresolved { background: var(--unresolved-bg); border-color: var(--unresolved); color: var(--unresolved); }
.chip.active-blocked { background: rgba(224,122,53,0.15); border-color: var(--orange); color: var(--orange); }
.filter-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
.search-box { padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg3); color: var(--text); font-size: 13px; width: 200px; }
.search-box:focus { outline: none; border-color: var(--accent); }

/* DIRECTION CARDS GRID */
.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; }
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; cursor: pointer; transition: border-color 0.15s; position: relative; }
.card:hover { border-color: var(--accent); }
.card.open { border-color: var(--accent2); }
.card.hidden { display: none; }

.card-header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.card-id { font-size: 11px; color: var(--text3); font-weight: 600; letter-spacing: 0.5px; white-space: nowrap; padding-top: 2px; }
.card-title-wrap { flex: 1; }
.card-title { font-size: 14px; font-weight: 600; color: #e0e4f0; margin-bottom: 3px; }
.card-title-en { font-size: 12px; color: var(--text2); }
.card-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.badge { padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
.badge-canon { background: var(--canon-bg); color: var(--canon); border: 1px solid rgba(76,175,130,0.3); }
.badge-working { background: var(--working-bg); color: var(--working); border: 1px solid rgba(232,184,75,0.3); }
.badge-unresolved { background: var(--unresolved-bg); color: var(--unresolved); border: 1px solid rgba(224,85,85,0.3); }
.badge-sourced { background: rgba(76,175,130,0.1); color: var(--sourced); border: 1px solid rgba(76,175,130,0.2); }
.badge-inferred { background: rgba(232,184,75,0.1); color: var(--inferred); border: 1px solid rgba(232,184,75,0.2); }
.badge-needs-input { background: rgba(224,122,53,0.1); color: var(--needs-input); border: 1px solid rgba(224,122,53,0.2); }
.badge-conflicting { background: rgba(224,85,85,0.1); color: var(--conflicting); border: 1px solid rgba(224,85,85,0.2); }
.badge-line { background: rgba(107,127,255,0.1); color: var(--accent); border: 1px solid rgba(107,127,255,0.2); }
.badge-blocked { background: rgba(224,122,53,0.12); color: var(--orange); border: 1px solid rgba(224,122,53,0.25); }

.card-summary { font-size: 13px; color: var(--text); line-height: 1.55; margin-bottom: 10px; }
.card-emotional { font-size: 12px; color: var(--teal); font-style: italic; border-left: 2px solid var(--teal); padding-left: 8px; margin-bottom: 10px; opacity: 0.9; }
.card-meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--text3); }
.card-meta span { display: flex; align-items: center; gap: 4px; }

.card-expand { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px; display: none; }
.card.open .card-expand { display: block; }

.section-toggle { font-size: 12px; color: var(--accent); cursor: pointer; padding: 4px 0; display: flex; align-items: center; gap: 4px; user-select: none; }
.section-toggle::before { content: '▶'; font-size: 10px; transition: transform 0.15s; }
.section-toggle.open::before { transform: rotate(90deg); }
.section-body { display: none; margin-top: 8px; }
.section-body.open { display: block; }

.pool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.pool-item { background: var(--bg3); border-radius: 6px; padding: 10px; }
.pool-item-id { font-size: 10px; color: var(--text3); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.pool-item-text { font-size: 12px; color: var(--text); line-height: 1.5; }
.pool-item-text .tag { font-size: 10px; background: rgba(76,175,130,0.15); color: var(--canon); padding: 1px 5px; border-radius: 2px; margin-left: 4px; }

.rec-box { background: var(--bg3); border-radius: 6px; padding: 12px; margin-top: 8px; }
.rec-row { margin-bottom: 6px; }
.rec-label { font-size: 11px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 2px; }
.rec-val { font-size: 13px; color: var(--text); }
.rec-val.green { color: var(--green); }
.rec-val.red { color: var(--red); }

.missing-bridge { background: rgba(224,122,53,0.08); border: 1px solid rgba(224,122,53,0.2); border-radius: 4px; padding: 8px; margin: 4px 0; font-size: 12px; color: #e0aa80; }
.open-question { background: rgba(107,127,255,0.08); border: 1px solid rgba(107,127,255,0.2); border-radius: 4px; padding: 8px; margin: 4px 0; font-size: 12px; color: #a0aaf0; }
.char-pill { display: inline-block; background: var(--bg4); border: 1px solid var(--border); border-radius: 3px; padding: 2px 7px; margin: 2px; font-size: 11px; color: var(--text2); }
.event-pill { display: inline-block; background: rgba(107,127,255,0.08); border: 1px solid rgba(107,127,255,0.15); border-radius: 3px; padding: 2px 7px; margin: 2px; font-size: 11px; color: #9ba8e0; }

/* SIDEBAR */
.sidebar-section { margin-bottom: 24px; }
.sidebar-title { font-size: 12px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }

/* CHARACTER LIST */
.char-item { padding: 10px; background: var(--bg3); border-radius: 6px; margin-bottom: 8px; cursor: pointer; transition: background 0.15s; }
.char-item:hover { background: var(--bg4); }
.char-name { font-size: 13px; font-weight: 600; color: #dde0f0; }
.char-role { font-size: 11px; color: var(--text3); margin-top: 2px; }
.char-arc { font-size: 12px; color: var(--text2); margin-top: 4px; font-style: italic; }

/* CONTRADICTION REGISTER */
.contra-item { padding: 10px; border-radius: 6px; margin-bottom: 8px; }
.contra-item.open-item { background: rgba(224,85,85,0.08); border: 1px solid rgba(224,85,85,0.2); }
.contra-item.partial { background: rgba(232,184,75,0.08); border: 1px solid rgba(232,184,75,0.2); }
.contra-item.resolved-item { background: rgba(76,175,130,0.06); border: 1px solid rgba(76,175,130,0.15); }
.contra-id { font-size: 11px; font-weight: 700; color: var(--text3); }
.contra-severity { display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 2px; margin-left: 6px; }
.sev-critical { background: rgba(224,85,85,0.2); color: var(--red); }
.sev-high { background: rgba(224,122,53,0.2); color: var(--orange); }
.sev-medium { background: rgba(232,184,75,0.15); color: var(--yellow); }
.sev-resolved { background: rgba(76,175,130,0.15); color: var(--green); }
.contra-topic { font-size: 12px; color: var(--text); margin-top: 4px; }
.contra-note { font-size: 11px; color: var(--text3); margin-top: 4px; }

/* COUNT BADGE */
.count-badge { display: inline-block; background: var(--bg4); color: var(--text2); font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 10px; margin-left: 6px; }
.count-red { background: rgba(224,85,85,0.15); color: var(--red); }
.count-orange { background: rgba(224,122,53,0.15); color: var(--orange); }

/* POOL2 RELEVANCE */
.p2-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
.p2-item { background: var(--bg3); border-radius: 4px; padding: 8px; display: flex; gap: 6px; align-items: flex-start; }
.p2-verdict { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 2px; white-space: nowrap; }
.p2-relevant { background: rgba(76,175,130,0.15); color: var(--green); }
.p2-not { background: rgba(85,94,120,0.3); color: var(--text3); }
.p2-needs { background: rgba(224,122,53,0.15); color: var(--orange); }
.p2-text { font-size: 11px; color: var(--text2); }

/* EMPTY STATE */
.empty-state { text-align: center; padding: 60px 24px; color: var(--text3); }
.empty-state h3 { font-size: 16px; color: var(--text2); margin-bottom: 8px; }

/* SCROLL */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* RESPONSIVE */
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { position: static; max-height: none; }
  .cards-grid { grid-template-columns: 1fr; }
}
</style>
</head>

// ============================================================
// FILTERS
// ============================================================
const filters = { stability: 'all', line: 'all', issues: 'all' };
let searchQuery = '';

function setFilter(type, val, el) {
  filters[type] = val;
  document.querySelectorAll(`[data-filter="${type}"]`).forEach(c => {
    c.className = 'chip';
    if (c.dataset.val === val) {
      if (val === 'canon') c.classList.add('active-canon');
      else if (val === 'working') c.classList.add('active-working');
      else if (val === 'unresolved') c.classList.add('active-unresolved');
      else if (val === 'blocked') c.classList.add('active-blocked');
      else c.classList.add('active');
    }
  });
  renderCards();
}

function doSearch(q) { searchQuery = q.toLowerCase(); renderCards(); }

function matchesFilters(dir) {
  if (filters.stability !== 'all' && dir.stability !== filters.stability) return false;
  if (filters.line !== 'all') {
    if (filters.line === 'mixed') {
      if (!dir.lines.includes('Alpha') || !dir.lines.includes('Beta')) return false;
    } else if (!dir.lines.includes(filters.line)) return false;
  }
  if (filters.issues === 'blocked' && !dir.blocked) return false;
  if (searchQuery) {
    const hay = (dir.title + dir.title_en + dir.summary + dir.id).toLowerCase();
    if (!hay.includes(searchQuery)) return false;
  }
  return true;
}

// ============================================================
// RENDER CARDS
// ============================================================
function getBadgeClass(s) {
  if (s === 'canon') return 'badge-canon';
  if (s === 'working') return 'badge-working';
  if (s === 'unresolved') return 'badge-unresolved';
  return 'badge';
}
function getClaimBadge(s) {
  if (s === '[SOURCED]') return 'badge-sourced';
  if (s === '[INFERRED]') return 'badge-inferred';
  if (s === '[NEEDS_AUTHOR_INPUT]') return 'badge-needs-input';
  if (s === '[CONFLICTING]') return 'badge-conflicting';
  return '';
}

function renderPool1(pool1) {
  if (!pool1) return '<div style="color:var(--text3);font-size:12px;padding:8px;">完整 Pool 1 分析在 direction_analysis/*.json 文件中。</div>';
  const labels = {
    '1_character_growth':'① Character Growth',
    '2_relationship_dynamics':'② Relationship Dynamics',
    '3_information_reveal_control':'③ Information / Reveal',
    '4_atmosphere_tension':'④ Atmosphere / Tension',
    '5_theme_expression':'⑤ Theme Expression',
    '6_structural_beat':'⑥ Structural Beat',
    '7_entry_timing':'⑦ Entry Timing',
    '8_world_rule':'⑧ World Rule / Mechanic',
    '9_setup_payoff':'⑨ Setup / Payoff',
    '10_audience_gap':'⑩ Audience Knowledge Gap',
    '11_canon':'⑪ Canon / Continuity',
    '12_execution':'⑫ Writing Execution'
  };
  return '<div class="pool-grid">' + Object.entries(pool1).map(([k,v]) =>
    `<div class="pool-item"><div class="pool-item-id">${labels[k]||k}</div><div class="pool-item-text">${v}</div></div>`
  ).join('') + '</div>';
}

function renderPool2(pool2) {
  if (!pool2) return '<div style="color:var(--text3);font-size:12px;padding:8px;">完整 Pool 2 分析在 direction_analysis/*.json 文件中。</div>';
  return '<div class="p2-grid">' + pool2.map(item => {
    const cls = item.verdict === 'RELEVANT' ? 'p2-relevant' : item.verdict === 'NOT_RELEVANT' ? 'p2-not' : 'p2-needs';
    const exp = item.expanded ? `<div style="margin-top:6px;font-size:11px;color:var(--text2);padding:6px;background:var(--bg4);border-radius:3px">${item.expanded}</div>` : '';
    return `<div class="p2-item"><span class="p2-verdict ${cls}">${item.verdict === 'NOT_RELEVANT' ? 'NOT_REL' : item.verdict}</span><div class="p2-text"><strong>Angle ${item.id} — ${item.name}</strong><br>${item.reason}${exp}</div></div>`;
  }).join('') + '</div>';
}

function toggleSection(btn) {
  btn.classList.toggle('open');
  btn.nextElementSibling.classList.toggle('open');
}

function toggleCard(id) {
  const card = document.getElementById('card-' + id);
  card.classList.toggle('open');
}

function renderCards() {
  const grid = document.getElementById('cards-grid');
  const empty = document.getElementById('empty-state');
  const visible = DIRECTIONS.filter(matchesFilters);

  if (visible.length === 0) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = visible.map(dir => {
    const stab = dir.stability.charAt(0).toUpperCase() + dir.stability.slice(1);
    const lineBadges = dir.lines.map(l => `<span class="badge badge-line">${l}</span>`).join('');
    const blockedBadge = dir.blocked ? `<span class="badge badge-blocked">⚠ BLOCKED</span>` : '';
    const charList = dir.chars.map(c => `<span class="char-pill">${c}</span>`).join('');
    const missingHtml = dir.missing.length ? dir.missing.map(m => `<div class="missing-bridge">⚠ ${m}</div>`).join('') : '';
    const questionsHtml = dir.questions.length ? dir.questions.map(q => `<div class="open-question">? ${q}</div>`).join('') : '';
    const authNeeded = dir.author_needed.length ? `<div style="margin-top:6px;"><span style="font-size:11px;color:var(--orange);">Author confirmation needed:</span> ${dir.author_needed.map(a=>`<span class="char-pill" style="color:var(--orange);border-color:rgba(224,122,53,0.3)">${a}</span>`).join('')}</div>` : '';

    return `<div class="card" id="card-${dir.id}" onclick="toggleCard('${dir.id}')">
      <div class="card-header">
        <div class="card-id">${dir.id}</div>
        <div class="card-title-wrap">
          <div class="card-title">${dir.title}</div>
          <div class="card-title-en">${dir.title_en}</div>
        </div>
      </div>
      <div class="card-badges">
        <span class="badge ${getBadgeClass(dir.stability)}">${stab}</span>
        <span class="badge ${getClaimBadge(dir.claim_status)}">${dir.claim_status}</span>
        ${lineBadges}
        ${blockedBadge}
      </div>
      <div class="card-summary">${dir.summary}</div>
      <div class="card-emotional">${dir.emotional}</div>
      <div class="card-meta">
        <span>🎭 ${dir.chars.length} chars</span>
        <span>📌 ${dir.events.length} events</span>
        ${dir.missing.length ? `<span style="color:var(--orange)">⚠ ${dir.missing.length} gap(s)</span>` : ''}
      </div>

      <div class="card-expand">
        <div style="margin-bottom:12px;">
          <div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">Dramatic Function</div>
          <div style="font-size:12px;color:var(--text2);">${dir.dramatic_fn}</div>
        </div>

        <div style="margin-bottom:12px;">
          <div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">Characters</div>
          ${charList}
        </div>

        <div style="margin-bottom:12px;">
          <div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">Key Events</div>
          ${dir.events.map(e=>`<span class="event-pill">${e}</span>`).join('')}
        </div>

        ${missingHtml || questionsHtml ? `<div style="margin-bottom:12px;">${missingHtml}${questionsHtml}${authNeeded}</div>` : ''}

        <div class="rec-box">
          <div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;">Recommendation</div>
          <div class="rec-row"><div class="rec-label">Strongest value</div><div class="rec-val green">${dir.best}</div></div>
          <div class="rec-row"><div class="rec-label">Biggest weakness</div><div class="rec-val red">${dir.worst}</div></div>
          <div class="rec-row"><div class="rec-label">Next action</div><div class="rec-val">${dir.next}</div></div>
        </div>

        <div style="margin-top:12px;">
          <div class="section-toggle" onclick="event.stopPropagation();toggleSection(this)">Pool 1 Analysis (12 Angles)</div>
          <div class="section-body">${renderPool1(dir.pool1)}</div>
        </div>

        <div style="margin-top:8px;">
          <div class="section-toggle" onclick="event.stopPropagation();toggleSection(this)">Pool 2 Relevance (Angles 13–19)</div>
          <div class="section-body">${renderPool2(dir.pool2)}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderSidebar() {
  // Characters
  const clist = document.getElementById('character-list');
  clist.innerHTML = CHARACTERS.map(c => `
    <div class="char-item">
      <div class="char-name">${c.name}</div>
      <div class="char-role">${c.role.replace(/_/g,' ')}</div>
      <div class="char-arc">${c.arc}</div>
    </div>
  `).join('');

  // Contradictions
  const contra = document.getElementById('contradiction-list');
  const openCount = CONTRADICTIONS.filter(c=>c.status!=='RESOLVED').length;
  document.getElementById('contra-open-count').textContent = openCount + ' Open';

  contra.innerHTML = '<div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;">Open / Partial</div>' +
    CONTRADICTIONS.map(c => {
      const isPartial = c.status === 'PARTIAL';
      const cls = isPartial ? 'partial' : 'open-item';
      const sevCls = c.severity === 'Critical' ? 'sev-critical' : c.severity === 'High' ? 'sev-high' : 'sev-medium';
      const statusLabel = isPartial ? 'PARTIAL' : 'OPEN';
      return `<div class="contra-item ${cls}">
        <div class="contra-id">${c.id}<span class="contra-severity ${sevCls}">${c.severity}</span></div>
        <div class="contra-topic">${c.topic}</div>
        <div class="contra-note">${c.note}</div>
        <div style="margin-top:4px;">${c.dirs.map(d=>`<span class="char-pill" style="font-size:10px">${d}</span>`).join('')}</div>
      </div>`;
    }).join('') +
    '<div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-top:16px;margin-bottom:8px;">Resolved <span class="count-badge">' + RESOLVED.length + '</span></div>' +
    RESOLVED.map(c => `<div class="contra-item resolved-item">
      <div class="contra-id">${c.id}<span class="contra-severity sev-resolved">RESOLVED</span></div>
      <div class="contra-topic" style="font-size:12px;color:var(--text2);">${c.topic}</div>
      <div class="contra-note">${c.note}</div>
    </div>`).join('');
}
